# Thème et réglages de l'application web. Ce fichier doit être à la racine du dépôt : Streamlit Community Cloud
# lance « streamlit run » depuis cette racine et ne lit pas web/.streamlit/. En local, lancer aussi depuis la racine :
# streamlit run web/streamlit_app.py
[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
baseFontSize = 16
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem"]
headingFontWeights = [700, 700, 700, 700]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600

[theme.light]
primaryColor = "#5B43B5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEEBF7"
textColor = "#14111F"
borderColor = "#8E86AA"
linkColor = "#43338F"
linkUnderline = false
codeBackgroundColor = "#EEEBF7"
codeTextColor = "#43338F"
dataframeHeaderBackgroundColor = "#E2DDF1"
greenColor = "#17692F"
redColor = "#B3141F"
yellowColor = "#855900"
orangeColor = "#A63F00"
blueColor = "#0550AE"
violetColor = "#5B43B5"
# Okabe-Ito (sûre pour les daltoniens), sans le jaune illisible sur blanc
chartCategoricalColors = ["#0072B2", "#D55E00", "#009E73", "#E69F00", "#CC79A7", "#56B4E9", "#6E56CF", "#1E1B2E"]

[theme.light.sidebar]
backgroundColor = "#E8E4F4"

# Mode sombre : les graphiques Plotly gardent un fond blanc (voir widgets.plot), leurs couleurs sont celles du clair.
[theme.dark]
primaryColor = "#7A63D8"
backgroundColor = "#0E0B16"
secondaryBackgroundColor = "#231E33"
textColor = "#F5F3FF"
borderColor = "#6E6590"
linkColor = "#CDBFFF"
linkUnderline = false
codeBackgroundColor = "#231E33"
codeTextColor = "#CDBFFF"
dataframeHeaderBackgroundColor = "#2E2842"
greenColor = "#3FB950"
redColor = "#F85149"
yellowColor = "#D29922"
orangeColor = "#E8803A"
blueColor = "#58A6FF"
violetColor = "#BAA7FF"
chartCategoricalColors = ["#56B4E9", "#E8803A", "#2BC48F", "#F0B429", "#E08FBF", "#8FD0F5", "#BAA7FF", "#ECEAF4"]

[theme.dark.sidebar]
backgroundColor = "#1A1626"
