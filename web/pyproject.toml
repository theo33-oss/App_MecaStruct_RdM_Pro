[project]
name = "mecastruct-web"
version = "0.1.0"
description = "MecaStruct RdM Pro — version web (Python / Streamlit) de l'application MATLAB de Théo Brun"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E741 : les noms l, I, O sont courants en RdM (longueur, inertie…)
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
# formules LaTeX : le formatage % évite de doubler chaque accolade (comme sprintf de ValidationReport.m)
"mecastruct/services/validation_report.py" = ["UP031"]
